packages:
  - packages/*
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
# The resolver depends on the published contract, whose exports name a source condition that only this
# workspace's copy can serve, as its tarball ships dist alone; with this, the resolver uses that copy.
overrides:
  '@mondarth/fvtt-package-catalogue-contract': 'workspace:*'
