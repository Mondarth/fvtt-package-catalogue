# Codecov reports coverage on pull requests; the thresholds in each package's Vitest configuration are what fail CI.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# One flag per package. The lcov reports give paths from the repository root.
flags:
  contract:
    paths: [packages/contract/src/]
    carryforward: true
  catalogue:
    paths: [packages/catalogue/src/]
    carryforward: true

comment:
  layout: 'condensed_header, diff, flags, files'
