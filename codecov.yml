# Codecov reports coverage on pull requests; the thresholds in each package's Vitest configuration are what fail CI.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# One flag per package. The lcov reports give paths from the repository root.
flags:
  contract:
    paths: [packages/catalogue-contract/src/]
    carryforward: true
  accounts-contract:
    paths: [packages/accounts-contract/src/]
    carryforward: true
  design-tokens:
    paths: [packages/design-tokens/src/]
    carryforward: true
  ui:
    paths: [packages/ui/src/]
    carryforward: true
  catalogue:
    paths: [apps/catalogue/src/]
    carryforward: true
  accounts:
    paths: [apps/accounts/src/]
    carryforward: true

comment:
  layout: 'condensed_header, diff, flags, files'
