name: Build the documentation
description: >-
  Builds the Sphinx site in Docker, into docs/_build/html, and the shared components' Storybook into its storybook/.

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # All Python tooling lives in the image built from docs/Dockerfile; nothing is
    # installed on the runner.
    - name: Build the Sphinx image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: docs
        tags: fvtt-package-catalogue-docs
        load: true
        cache-from: type=gha,scope=docs
        cache-to: type=gha,scope=docs,mode=max

    # Warnings fail the build (see docs/Makefile).
    - name: Build the documentation
      shell: bash
      run: |
        DOCS_UID=$(id -u) DOCS_GID=$(id -g) \
          docker compose -f docs/compose.yaml run --rm --no-deps -T docs make html

    # The components' Storybook, published beside the documentation, where an application's own can compose it.
    - uses: ./.github/actions/setup
    - name: Build the components' Storybook
      shell: bash
      run: pnpm --filter @mondarth/ui exec storybook build --quiet -o "$GITHUB_WORKSPACE/docs/_build/html/storybook"
