name: CodeQL

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  # Code scanning and dependency review need GitHub Code Security on a private repository, which the organisation
  # does not have: they run only while the repository is public, and are skipped, not failed, while it is private.
  # Asked of the API, as a scheduled run's event does not reliably say. Neither is a required check.
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.ask.outputs.public }}
    steps:
      - id: ask
        run: echo "public=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private | not')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: visibility
    if: ${{ needs.visibility.outputs.public == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
