# The catalogue and Mondarth's accounts in production, beside an existing SWAG (linuxserver/swag) container that serves
# each on its own subdomain over HTTPS: the catalogue's server, the worker that fills its database, its database, and
# the one-shot migration that runs before both start; and the accounts' server, their database and their migration.
#
#   cp .env.example .env    # then set the passwords, keys and addresses it asks for
#   docker compose up -d
#
# Only the two servers join SWAG's network. The catalogue asks the accounts who is signed in, on a network the two
# share alone (`internal`), with its key. Each database is on a network of its own with no way out. See swag/ for
# SWAG's side, and the deployment guide in the documentation.
name: fvtt-package-catalogue

x-image: &image ghcr.io/mondarth/fvtt-package-catalogue:${CATALOGUE_TAG:-latest}

x-database-url: &database-url postgres://${POSTGRES_USER:-catalogue}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-catalogue}

x-accounts-image: &accounts-image ghcr.io/mondarth/accounts:${ACCOUNTS_TAG:-latest}

x-accounts-database-url: &accounts-database-url postgres://accounts:${ACCOUNTS_POSTGRES_PASSWORD:?set ACCOUNTS_POSTGRES_PASSWORD in .env}@accounts-db:5432/accounts

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalogue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-catalogue}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30

  # Brings the schema up to date, then exits. The server waits for it.
  migrate:
    image: *image
    <<: *hardening
    command: ['node', 'build/worker/main.js', 'migrate']
    # The image's health check asks the server, which only the app runs.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
    restart: 'no'

  app:
    image: *image
    <<: *hardening
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      API_KEYS: ${API_KEYS:?set API_KEYS in .env}
      API_RATE_PER_MINUTE: ${API_RATE_PER_MINUTE:-}
      # The accounts, on the network the two share, with the catalogue's key; and as visitors reach them.
      ACCOUNTS_URL: http://accounts:3000
      ACCOUNTS_KEY: ${CATALOGUE_ACCOUNTS_KEY:?set CATALOGUE_ACCOUNTS_KEY in .env}
      ACCOUNTS_SITE_URL: ${ACCOUNTS_SITE_URL:?set ACCOUNTS_SITE_URL in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: '3000'
      # SWAG is the only proxy in front: trust what it says of the client and the original request.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
    depends_on:
      migrate:
        condition: service_completed_successfully
      accounts:
        condition: service_healthy
    networks:
      database:
      # Rechecks fetch packages' own manifests from the server.
      egress:
      # The accounts' internal API.
      internal:
      swag:
        # The name SWAG's proxy configuration reaches the server by.
        aliases: [fvtt-package-catalogue]
    # Not published on the host: SWAG reaches it on its network.
    expose: ['3000']

  # Crawls the packages clients ask for, and what they need, and keeps Foundry VTT's builds up to date. A SIGTERM lets
  # it finish the package in hand.
  worker:
    image: *image
    <<: *hardening
    restart: unless-stopped
    command: ['node', 'build/worker/main.js', 'run']
    # The image's health check asks the server, which only the app runs.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      # Packages crawled an hour to warm the catalogue; 0 turns warming off.
      WARM_PER_HOUR: ${WARM_PER_HOUR:-300}
      # Packages crawled at once, and requests made to any one host at once across them.
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-4}
      CRAWL_PER_HOST: ${CRAWL_PER_HOST:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database, egress]
    stop_grace_period: 60s

  accounts-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: ${ACCOUNTS_POSTGRES_PASSWORD:?set ACCOUNTS_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: accounts
    volumes:
      - accountsdata:/var/lib/postgresql
    networks: [accounts-database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U accounts -d accounts']
      interval: 5s
      timeout: 3s
      retries: 30

  # Brings the accounts' schema up to date, then exits. Their server waits for it.
  accounts-migrate:
    image: *accounts-image
    <<: *hardening
    command: ['node', 'build/migrate.js']
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: *accounts-database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      accounts-db:
        condition: service_healthy
    networks: [accounts-database]
    restart: 'no'

  # Mondarth's accounts: signing in, once, to every application, the profile, subscriptions and payments.
  accounts:
    image: *accounts-image
    <<: *hardening
    restart: unless-stopped
    environment:
      DATABASE_URL: *accounts-database-url
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      SITE_URL: ${ACCOUNTS_SITE_URL:?set ACCOUNTS_SITE_URL in .env}
      # The applications on the shared domain, signed in by one cookie, and sent back to once signed in.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_ORIGINS: ${SITE_URL:?set SITE_URL in .env}
      # The catalogue's key, and any being rotated in beside it.
      INTERNAL_API_KEYS: ${CATALOGUE_ACCOUNTS_KEY:?set CATALOGUE_ACCOUNTS_KEY in .env}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID:-}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET:-}
      AUTH_PATREON_ID: ${AUTH_PATREON_ID:-}
      AUTH_PATREON_SECRET: ${AUTH_PATREON_SECRET:-}
      PATREON_CAMPAIGN_ID: ${PATREON_CAMPAIGN_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_TAX_CODE: ${STRIPE_TAX_CODE:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: '3000'
      # SWAG is the only proxy in front: trust what it says of the client and the original request.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
    depends_on:
      accounts-migrate:
        condition: service_completed_successfully
    networks:
      accounts-database:
      # Signing in asks the providers who signed in; Patreon and Stripe are asked too.
      egress:
      # The catalogue asks the internal API here, as `accounts`.
      internal:
      swag:
        aliases: [mondarth-accounts]
    expose: ['3000']

networks:
  database:
    internal: true
  accounts-database:
    internal: true
  # The catalogue and the accounts alone, for the accounts' internal API.
  internal:
    internal: true
  egress:
  swag:
    external: true
    name: ${SWAG_NETWORK:-swag_default}

volumes:
  pgdata:
  accountsdata:
