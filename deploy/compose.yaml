# The catalogue in production: the server, its database, and the one-shot migration that runs before the server starts,
# beside an existing SWAG (linuxserver/swag) container that serves it over HTTPS.
#
#   cp .env.example .env    # then set POSTGRES_PASSWORD and API_KEYS
#   docker compose up -d
#
# Only the server joins SWAG's network; the database is on a network of its own with no way out. See
# swag/fvtt-package-catalogue.subdomain.conf.sample for SWAG's side, and the deployment guide in the documentation.
name: fvtt-package-catalogue

x-image: &image ghcr.io/mondarth/fvtt-package-catalogue:${CATALOGUE_TAG:-latest}

x-database-url: &database-url postgres://${POSTGRES_USER:-catalogue}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-catalogue}

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalogue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-catalogue}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30

  # Brings the schema up to date, then exits. The server waits for it.
  migrate:
    image: *image
    <<: *hardening
    command: ['node', 'build/worker/main.js', 'migrate']
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
    restart: 'no'

  app:
    image: *image
    <<: *hardening
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      API_KEYS: ${API_KEYS:?set API_KEYS in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: '3000'
      # SWAG is the only proxy in front: trust what it says of the client and the original request.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      database:
      swag:
        # The name SWAG's proxy configuration reaches the server by.
        aliases: [fvtt-package-catalogue]
    # Not published on the host: SWAG reaches it on its network.
    expose: ['3000']

networks:
  database:
    internal: true
  swag:
    external: true
    name: ${SWAG_NETWORK:-swag_default}

volumes:
  pgdata:
