# A throwaway PostgreSQL for the accounts' end-to-end tests (`pnpm e2e:db`), on localhost:55435. Its data lives in
# memory and goes with it.
name: mondarth-accounts-e2e

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: accounts
      POSTGRES_DB: accounts_e2e
    ports:
      - '127.0.0.1:${E2E_DB_PORT:-55435}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U accounts -d accounts_e2e']
      interval: 1s
      timeout: 3s
      retries: 60
